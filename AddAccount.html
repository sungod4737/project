<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Account - Hometube</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous" defer></script>

    <style>
         :root {
            --navbar-height: 56px;
        }
        
        html,
        body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #f9f9f9;
        }
        
        .topNavbar {
            min-height: var(--navbar-height);
            z-index: 1030;
        }
        
        .auth-wrapper {
            min-height: calc(100vh - var(--navbar-height));
        }
        
        .auth-card {
            max-width: 440px;
            border-radius: 16px;
        }
        
        .form-control:focus,
        .form-check-input:focus,
        .btn:focus {
            border-color: #dc3545 !important;
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25) !important;
        }
        
        .form-check-input:checked {
            background-color: #dc3545;
            border-color: #dc3545;
        }
    </style>
</head>

<body>

    <!-- Top Navbar -->
    <nav class="navbar navbar-light bg-white border-bottom sticky-top topNavbar p-0">
        <div class="container-fluid h-100 d-flex align-items-center justify-content-between px-3">
            <a href="Index.html" class="navbar-brand d-flex align-items-center me-0 text-decoration-none">
                <i class="fa-solid fa-house text-danger me-2 fs-4"></i>
                <span class="fw-bold fs-5 text-dark">Hometube</span>
            </a>
        </div>
    </nav>

    <!-- Main Form Area -->
    <main class="d-flex justify-content-center align-items-center auth-wrapper p-3">
        <div class="card border-0 shadow-sm auth-card w-100 p-3 p-sm-4">
            <div class="card-body">

                <div class="text-center mb-4">
                    <div class="rounded-circle bg-danger bg-opacity-10 text-danger d-inline-flex align-items-center justify-content-center p-3 mb-3" style="width: 64px; height: 64px;">
                        <i class="fa-solid fa-user-plus fs-3"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Add Account</h4>
                    <p class="text-muted small mb-0">Enter account details to log in</p>
                </div>

                <form action="Account.html" method="GET" id="addAccountForm" autocomplete="off">

                    <!-- Username Field -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary" for="usernameInput">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-at"></i></span>
                            <input type="text" name="username" id="usernameInput" class="form-control border-start-0 ps-0" placeholder="e.g. alex_smith" required>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary" for="passwordInput">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" id="passwordInput" class="form-control border-start-0 ps-0" placeholder="••••••••" minlength="6" required>
                        </div>
                    </div>

                    <!-- Terms Checkbox -->
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="termsCheck" required>
                        <label class="form-check-label small text-secondary" for="termsCheck">
                            I agree to the <a href="#" class="text-danger text-decoration-none fw-bold">Terms & Conditions</a>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submitBtn" class="btn btn-danger w-100 py-2 fw-bold mb-3 shadow-sm">
                        <i class="fa-solid fa-user-plus me-2"></i>Add Account
                    </button>
                </form>

            </div>
        </div>
    </main>

    <script src="Homtube.js" defer></script>

</body>

</html>
