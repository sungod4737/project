<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeTube - Upload</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem 1rem;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff0000;
            text-decoration: none;
        }
        
        .btn {
            padding: 0.5rem 1rem;
            background: #272727;
            color: #fff;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            background: #383838;
        }
        
        .btn-primary {
            background: #ff0000;
        }
        
        .btn-primary:hover {
            background: #cc0000;
        }
        
        .tabs-nav {
            display: flex;
            gap: 1rem;
            border-bottom: 1px solid #272727;
            margin-bottom: 2rem;
            overflow-x: auto;
        }
        
        .nav-link {
            color: #aaa;
            padding: 0.75rem 1.2rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            position: relative;
            white-space: nowrap;
        }
        
        .nav-link:hover,
        .nav-link.active {
            color: #fff;
        }
        
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #ff0000;
            border-radius: 2px 2px 0 0;
        }
        
        .upload-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        @media (max-width: 768px) {
            .upload-layout {
                grid-template-columns: 1fr;
            }
        }
        
        .form-card,
        .preview-card {
            background: #181818;
            border: 1px solid #272727;
            border-radius: 12px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-group label {
            font-size: 0.9rem;
            color: #ccc;
        }
        
        .form-control {
            padding: 0.75rem;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #ff0000;
        }
        
        .drop-zone {
            border: 2px dashed #333;
            border-radius: 12px;
            padding: 2rem 1rem;
            text-align: center;
            background: #0f0f0f;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        
        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: #ff0000;
            background-color: #1a0a0a;
        }
        
        .drop-zone-icon {
            font-size: 2rem;
            color: #888;
        }
        
        .drop-zone-text {
            font-size: 0.85rem;
            color: #aaa;
        }
        
        .drop-zone-text span {
            color: #ff0000;
            font-weight: 600;
            text-decoration: underline;
        }
        
        #videoFileInput {
            display: none;
        }
        
        .preview-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px dashed #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
        }
        
        .preview-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        
        .preview-placeholder {
            color: #666;
            font-size: 0.85rem;
            text-align: center;
            padding: 1rem;
        }
        
        .file-meta {
            margin-top: 0.75rem;
            font-size: 0.8rem;
            color: #aaa;
            word-break: break-all;
        }
        
        .status-msg {
            font-size: 0.85rem;
            margin-top: 0.5rem;
            font-weight: 600;
        }
    </style>
    
</head>

<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="logo">HomeTube</a>
            <a href="Account.html" class="btn">My Account</a>
        </header>

        <nav class="tabs-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="favorites.html" class="nav-link">Favorites</a>
            <a href="history.html" class="nav-link">History</a>
            <a href="upload.html" class="nav-link active">+ Upload</a>
        </nav>

        <main>
            <div class="upload-layout">
                <div class="form-card">
                    <h2 style="margin-bottom: 1.5rem;">Upload Video File</h2>
                    <form id="uploadForm">
                        <div class="form-group">
                            <label for="videoTitle">Video Title</label>
                            <input type="text" id="videoTitle" class="form-control" placeholder="e.g., My Project Showcase" required>
                        </div>

                        <div class="form-group">
                            <label for="videoChannel">Channel / Author</label>
                            <input type="text" id="videoChannel" class="form-control" placeholder="e.g., Creator Name" required>
                        </div>

                        <div class="form-group">
                            <label>Select or Drag Video</label>
                            <div class="drop-zone" id="dropZone">
                                <div class="drop-zone-icon">📁</div>
                                <div class="drop-zone-text">Drag video here, or <span>browse</span></div>
                                <input type="file" id="videoFileInput" accept="video/*">
                            </div>
                        </div>

                        <div id="uploadStatus" class="status-msg"></div>

                        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">Upload & Publish</button>
                    </form>
                </div>

                <div class="preview-card">
                    <h2>Video Preview</h2>
                    <p style="font-size: 0.85rem; color: #888; margin-top: 0.25rem;">Preview your video before publishing.</p>

                    <div class="preview-box">
                        <div class="preview-placeholder" id="previewPlaceholder">No video loaded yet</div>
                        <video id="previewPlayer" controls></video>
                    </div>

                    <div class="file-meta" id="fileMeta"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="hometube.js" defer></script>
</body>

</html>
